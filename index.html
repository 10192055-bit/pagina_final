<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naruko</title>
    <link rel="stylesheet" href="estilo.css">
    <script src="ds.js" defer></script>
  
</head>
<body>

<!--  BARRA DE NAVEGACIÓN  -->
<!-- Barra fija superior: contiene el logo y el menú de enlaces -->
    <nav class="barra-navegacion">
        <!-- Logo de la página; al hacer clic lleva al inicio (#inicio) -->
        <a class="marca" href="#inicio">
        <img src="img/logo_final.png" alt="" width="150">
        </a>
        <!-- Botón hamburguesa: solo se ve en celulares, abre/cierra el menú -->
        <button class="boton-menu" id="botonMenu" aria-label="Abrir menú" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <!-- Lista de enlaces del menú. Cada uno lleva a una sección de la página -->
        <ul class="contenedor-enlaces" id="listaEnlaces">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="menu.html">Menú</a></li>
            <li><a href="historia.html">Historia</a></li>

        </ul>
    </nav>

    <!-- Fondo oscuro que aparece detrás del menú en celulares.
         Sirve para cerrar el menú tocando afuera de él -->
    <div class="capa-menu" id="capaMenu"></div>

<!--  PORTADA (HERO)  -->
<!-- Es la primera pantalla que ve el usuario: título grande, descripción y botones -->
    <header class="portada" id="inicio">
        <div class="texto-portada">
            <!-- Texto decorativo japonés (queda vacío, se llena por CSS si se desea) -->
            <span class="texto-japones"></span>
            <!-- Título principal. <em> resalta en color y .texto-contorno crea texto con borde -->
            <h1>SABOR,<br><em>TRADICIÓN  </em> Y<br><span class="texto-contorno">FELICIDAD.</span></h1>
            <!-- Párrafo de bienvenida -->
            <p>Dieciocho horas de cocción lenta, fideos estirados a mano cada mañana y una receta que Neruko a perfeccionado. Bienvenido al ramen honesto de barrio.</p>
            <!-- Fila que agrupa los botones de llamada a la acción (CTA) -->

        </div>
        <!-- Capa visual decorativa de la mascota Neruko (lado derecho) -->
           <div class="capa-visual">
            <img src="img/neruko%20para%20la%20pagina.png" alt="Conoce a Neruko">
        </div>

    </header>

<!--  CARRUSEL DE PLATILLOS  -->
<!-- Muestra las fotos del menú una a la vez, con flechas y puntitos de navegación -->
    <section class="seccion bloque-carrusel" aria-label="Galería de platillos">
        <p class="etiqueta-seccion">GALERÍA</p>
        <h2 class="titulo-seccion">NUESTROS <em>PLATILLOS</em></h2>

        <div class="carrusel">
            <!-- Ventana que recorta: solo se ve la imagen actual -->
            <div class="ventana-carrusel">
                <!-- Fila deslizante: el JavaScript la mueve con transform -->
                <div class="pista-carrusel" id="pistaCarrusel">
                    <div class="imagen-carrusel"><img src="img/Shoyu%20Cl%C3%A1sico.jpg" alt="Shoyu Clásico"></div>
                    <div class="imagen-carrusel"><img src="img/Miso%20Robusto.jpg" alt="Miso Robusto"></div>
                    <div class="imagen-carrusel"><img src="img/Tonkotsu%20Kuro.jpg" alt="Tonkotsu Kuro"></div>
                    <div class="imagen-carrusel"><img src="img/Tantanmen%20Fuego.jpg" alt="Tantanmen Fuego"></div>
                    <div class="imagen-carrusel"><img src="img/Yuzu%20Shio.jpg" alt="Yuzu Shio"></div>
                    <div class="imagen-carrusel"><img src="img/Kinoku%20Veggie.jpg" alt="Kinoku Veggie"></div>
                    <div class="imagen-carrusel"><img src="img/Gyoza.jpg" alt="Gyoza"></div>
                    <div class="imagen-carrusel"><img src="img/Sushi.jpg" alt="Sushi"></div>
                </div>
            </div>

            <!-- Flechas laterales para cambiar de imagen -->
            <button class="boton-carrusel anterior" id="flechaAnterior" aria-label="Imagen anterior">&#10094;</button>
            <button class="boton-carrusel siguiente" id="flechaSiguiente" aria-label="Imagen siguiente">&#10095;</button>

            <!-- Puntitos indicadores: los crea el JavaScript -->
            <div class="puntos-carrusel" id="puntosCarrusel"></div>
        </div>
    </section>

<!--  PIE DE PÁGINA  -->
<!-- Cierre de la página: derechos de autor y redes sociales -->
    <footer class="pie-pagina">
        <!-- Texto de copyright. El año lo inserta JavaScript en el <span id="anio"> -->
        <p>© <span id="anio"></span> Naruko Ramen — Hecho con caldo, paciencia y fuego.</p>

        <!-- Enlaces a redes sociales (abren en pestaña nueva) -->
        <div class="redes-sociales">
    <a href="https://instagram.com/tu-usuario" target="_blank" rel="noopener" aria-label="Instagram">

    </a>
    <a href="https://tiktok.com/@tu-usuario" target="_blank" rel="noopener" aria-label="TikTok">

    </a>
    <a href="https://wa.me/51955550189" target="_blank" rel="noopener" aria-label="WhatsApp">

    </a>
</div>
    </footer>

</body>
</html>
